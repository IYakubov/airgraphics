<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirShape Design</title>
<style>
:root{--o:#D97757;--o2:#C15F3C;--sel:#0C8CE9;--ink:#1f1e1c;--mute:#8b887f;--line:#ecebe6;--panel:#ffffff;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:12px;color:var(--ink);background:#EEEDE9;user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable=true]{user-select:text;-webkit-user-select:text}
#stage{position:fixed;inset:0;background-color:#EEEDE9;
  background-image:radial-gradient(circle,#d3d0c8 1px,transparent 1.3px);touch-action:none}
#stage.grab{cursor:grab}#stage.grabbing{cursor:grabbing}#stage.cross{cursor:crosshair}#stage.txt{cursor:text}
#doc,#ov{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
#ov{pointer-events:none}
#ov .fl{font:500 11px var(--font);fill:#8b887f}
#ov .fl.on{fill:var(--sel)}
#hands{position:fixed;inset:0;pointer-events:none;z-index:40}
.hc{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #8b887f;
  pointer-events:none;z-index:41;display:none;transition:background .12s,border-color .12s,width .12s,height .12s,margin .12s}
.hc.on{display:block}.hc.lock{opacity:.35}.hc.tool{border-color:var(--o)}
.hc.pinch{background:var(--o);border-color:var(--o);width:14px;height:14px;margin:-7px 0 0 -7px}
.hc.fist{border-style:dashed;border-color:var(--ink);width:34px;height:34px;margin:-17px 0 0 -17px}

.ui{position:fixed;z-index:20;background:var(--panel);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(40,30,20,.08);border:1px solid rgba(0,0,0,.05)}
#left{top:12px;left:12px;bottom:12px;width:240px;display:flex;flex-direction:column}
#right{top:12px;right:12px;bottom:12px;width:250px;display:flex;flex-direction:column}
.hdr{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.logo{width:22px;height:22px;border-radius:7px;background:var(--o);display:grid;place-items:center;flex:none}
.logo i{width:8px;height:8px;border-radius:2px;background:#fff;transform:rotate(45deg)}
#fname{font:600 13px var(--font);border:0;outline:0;background:transparent;width:100%;padding:3px 4px;border-radius:5px}
#fname:hover,#fname:focus{background:#f5f4f0}
.ttl{padding:12px 14px 6px;font-weight:600;font-size:11.5px}
#layers{flex:1;overflow:auto;padding:0 6px 10px}
.layer{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:7px;cursor:default;white-space:nowrap}
.layer:hover{background:#f5f4f0}.layer.on{background:#e5f2fd}
.layer.child{padding-left:26px}
.layer svg{width:14px;height:14px;flex:none;stroke:#8b887f;fill:none;stroke-width:1.7}
.layer.on svg{stroke:var(--sel)}
.layer .nm{overflow:hidden;text-overflow:ellipsis;outline:0}
.layer.frame .nm{font-weight:600}

.rtop{display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:1px solid var(--line)}
.btn{font:600 12px var(--font);border:0;border-radius:8px;padding:8px 11px;cursor:pointer;background:#f3f2ee;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#e9e8e3}
.btn.pri{background:var(--o);color:#fff}.btn.pri:hover{background:var(--o2)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
#handsBtn.live{background:#fbeee8;color:var(--o2)}
#handsBtn .dot{width:7px;height:7px;border-radius:50%;background:#b7b3a9}
#handsBtn.live .dot{background:var(--o);box-shadow:0 0 0 3px rgba(217,119,87,.25)}
#zoom{margin-left:auto;color:var(--mute);font-weight:500;padding:0 4px;cursor:pointer}
#props{flex:1;overflow:auto}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.lbl{font-weight:600;font-size:11.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fld{display:flex;align-items:center;background:#f5f4f0;border-radius:7px;height:30px;padding:0 8px;gap:6px;border:1px solid transparent}
.fld:focus-within{border-color:var(--sel);background:#fff}
.fld span{color:var(--mute);font-size:11px;min-width:10px}
.fld input,.fld select{border:0;outline:0;background:transparent;font:500 12px var(--font);width:100%;color:var(--ink)}
.fld input[type=color]{width:20px;height:20px;padding:0;border-radius:5px;flex:none;cursor:pointer}
.fld input[type=color]::-webkit-color-swatch-wrapper{padding:0}.fld input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.1);border-radius:5px}
.mt{margin-top:7px}
.head input{font:600 13px var(--font);border:0;outline:0;width:100%;padding:4px 6px;border-radius:6px;background:transparent}
.head input:hover,.head input:focus{background:#f5f4f0}
.head{display:flex;align-items:center;gap:6px}
.head svg{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:1.7;flex:none}
.alg{display:flex;gap:2px;background:#f5f4f0;border-radius:8px;padding:2px}
.alg button{flex:1;height:26px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.alg button:hover{background:#fff}.alg button:disabled{opacity:.35;cursor:default;background:transparent}
.alg svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.acts .btn{justify-content:center}
.acts .del{color:#c0392b}
textarea.ta{width:100%;min-height:54px;border:1px solid transparent;border-radius:7px;background:#f5f4f0;font:500 12px var(--font);padding:7px 8px;outline:0;resize:vertical}
textarea.ta:focus{border-color:var(--sel);background:#fff}
.gest{display:grid;gap:7px}
.gest div{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:#f7f6f2;line-height:1.3}
.gest b{display:block;font-size:12px}.gest small{color:var(--mute);font-size:11px}
.gest svg{width:18px;height:18px;stroke:var(--o);fill:none;stroke-width:1.8;flex:none}
.muted{color:var(--mute);line-height:1.5}

#toolbar{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:14px}
#toolbar .sep{width:1px;background:var(--line);margin:6px 4px}
.tb{position:relative;width:40px;height:40px;border:0;border-radius:10px;background:transparent;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.tb:hover{background:#f3f2ee}
.tb svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tb.on{background:var(--o)}.tb.on svg{stroke:#fff}
.tb .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--o);width:0}
.tb.on .bar{background:#fff}
.tb .tip{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 9px;border-radius:7px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tb{overflow:visible}.tb:hover .tip{opacity:1}
.tip kbd{font-family:var(--font);opacity:.6;margin-left:6px}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:19;font-size:12px;color:var(--mute);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.on{opacity:1}
#toast{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%) scale(.92);z-index:45;font-size:36px;font-weight:750;letter-spacing:-.03em;color:var(--o);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-shadow:0 2px 24px #fff}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.small{font-size:14px;font-weight:600;color:var(--ink);background:#fff;padding:9px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.1);text-shadow:none;top:auto;bottom:112px;transform:translate(-50%,0)}
textarea.te{position:fixed;z-index:15;border:1.5px solid var(--sel);background:transparent;outline:0;resize:none;overflow:hidden;white-space:pre;line-height:1.2;padding:0;margin:0}
#cam{position:fixed;right:276px;bottom:16px;width:200px;border-radius:12px;transform:scaleX(-1);z-index:30;display:none;box-shadow:0 8px 30px rgba(0,0,0,.15)}
#cam.show{display:block}
.menu{position:absolute;top:44px;right:10px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.14);padding:5px;display:none;z-index:30;min-width:170px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font:500 12px var(--font);padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:#f3f2ee}
#handsMenu{left:10px;right:auto;min-width:220px}
.menu button small{display:block;color:var(--mute);font-size:11px;font-weight:400;margin-top:1px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(238,237,233,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.mcard{width:min(380px,92vw);background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(60,40,20,.16);text-align:center}
.mcard h3{font-size:18px;letter-spacing:-.02em;margin-bottom:6px}
#qr{width:236px;height:236px;margin:16px auto 14px;display:grid;place-items:center;border-radius:14px;background:#f7f6f2}
#qr svg{width:220px;height:220px}
#pstatus{margin:12px 0 14px;font-weight:600;font-size:12.5px;color:var(--o2);min-height:18px}
.mcard .fld{text-align:left}
.mcard .note{font-size:11px;color:var(--mute);line-height:1.45;margin-top:8px;text-align:left}
/* phone camera page */
body.phone{background:#111;color:#fff}
body.phone > :not(#phoneUI){display:none!important}
#phoneUI{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px;font-size:14px}
#phoneUI .top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
#phoneUI video{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:18px;background:#000}
#phoneUI video.mirror{transform:scaleX(-1)}
#phoneUI .st{text-align:center;color:#d8d4cb;min-height:20px}
#phoneUI .st b{color:#F0A687}
#phoneUI .row{display:flex;gap:10px}
#phoneUI button{flex:1;font:600 15px var(--font);border:0;border-radius:14px;padding:15px;background:#2a2926;color:#fff}
#phoneUI button.pri{background:var(--o)}
#phoneUI .tip{font-size:12px;color:#9a968d;text-align:center;line-height:1.45}
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="stage"><svg id="doc"><defs id="defs"></defs><g id="world"></g></svg></div>
<svg id="ov"></svg>

<div id="left" class="ui">
  <div class="hdr"><div class="logo"><i></i></div><input id="fname" value="Untitled" spellcheck="false"></div>
  <div class="ttl">Layers</div>
  <div id="layers"></div>
</div>

<div id="right" class="ui">
  <div class="rtop">
    <button class="btn" id="handsBtn" title="Design with your hands"><span class="dot"></span>Hands</button>
    <button class="btn" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
    <span id="zoom" title="Zoom to fit (Shift+1)">100%</span>
    <div class="menu" id="handsMenu">
      <button data-src="webcam">This computer's camera<small>Built-in or USB webcam</small></button>
      <button data-src="phone">Phone as camera<small>Scan a QR code with your phone</small></button>
    </div>
    <div class="menu" id="exportMenu">
      <button data-exp="png">PNG (2×)</button>
      <button data-exp="svg">SVG</button>
      <button data-exp="json">Project file (.json)</button>
      <button data-exp="open">Open project file…</button>
    </div>
  </div>
  <div id="props"></div>
</div>

<div id="toolbar" class="ui"></div>
<div id="hint"></div>
<div id="toast"></div>
<video id="cam" playsinline muted autoplay></video>
 <div class="modal" id="phoneModal"><div class="mcard">
  <h3>Use your phone as the camera</h3>
  <div class="muted">Scan with your phone and tap <b>Start camera</b>. Put the phone by your monitor, facing you.</div>
  <div id="qr"><span class="muted">Preparing…</span></div>
  <label class="fld"><span>Link</span><input id="phoneUrl" spellcheck="false"></label>
  <div class="note" id="pnote"></div>
  <div id="pstatus"></div>
  <button class="btn" id="pcancel" style="width:100%;justify-content:center">Cancel</button>
</div></div>
<input type="file" id="openFile" accept=".json,application/json" hidden>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PEER_JS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const QR_JS = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const loadScript = src => new Promise((res, rej) => {
  if (document.querySelector(`script[src="${src}"]`)) return res();
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
});
const PHONE_TARGET = new URLSearchParams(location.search).get('cam');
if (PHONE_TARGET) phoneMain(); else main();

function main() {

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const FONT = 'Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
const ORANGE = '#D97757';

/* =========================================================
   ICONS
   ========================================================= */
const IC = {
  move: '<path d="M6 3.5l12 7.2-5.3 1.5-2.4 5.3z"/>',
  frame: '<path d="M8 3v18M16 3v18M3 8h18M3 16h18"/>',
  rect: '<rect x="4" y="5.5" width="16" height="13" rx="1.5"/>',
  ellipse: '<circle cx="12" cy="12" r="8"/>',
  triangle: '<path d="M12 4.5l8.5 15h-17z"/>',
  text: '<path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/>',
  hand: '<path d="M8.5 12.5V6.2a1.4 1.4 0 012.8 0v4.8m0-5.6a1.4 1.4 0 012.8 0V11m0-4.2a1.4 1.4 0 012.8 0v6.4c0 4-2.4 6.8-6.2 6.8-2.6 0-4.2-1.4-5.2-3.2l-2-3.8a1.4 1.4 0 012.4-1.4l1.6 2"/>'
};
const svgI = (k, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}">${IC[k]}</svg>`;
const ALG = {
  l: '<path d="M4 3v18M8 7h10M8 13h6"/>', c: '<path d="M12 3v18M6 7h12M8 13h8"/>', r: '<path d="M20 3v18M6 7h10M10 13h6"/>',
  t: '<path d="M3 4h18M7 8v10M13 8v6"/>', m: '<path d="M3 12h18M7 6v12M13 8v8"/>', b: '<path d="M3 20h18M7 6v10M13 10v6"/>'
};

/* =========================================================
   DOCUMENT
   ========================================================= */
let doc = [];                 // ordered nodes; children reference parent frame id
let sel = new Set();
const view = { x: 0, y: 0, z: 1 };
let tool = 'move';
const DRAW = ['frame', 'rect', 'ellipse', 'triangle'];
const TYPE_NAME = { frame: 'Frame', rect: 'Rectangle', ellipse: 'Ellipse', triangle: 'Triangle', text: 'Text' };
const get = id => doc.find(n => n.id === id);
const S2W = (sx, sy) => ({ x: (sx - view.x) / view.z, y: (sy - view.y) / view.z });
const W2S = (wx, wy) => ({ x: wx * view.z + view.x, y: wy * view.z + view.y });
let idc = 1;
const newId = () => 'n' + (idc++) + Math.random().toString(36).slice(2, 6);

const mctx = document.createElement('canvas').getContext('2d');
function measure(n) {
  if (n.type !== 'text') return;
  mctx.font = `${n.fontWeight} ${n.fontSize}px ${FONT}`;
  const lines = String(n.text).split('\n');
  n.w = Math.max(4, ...lines.map(l => mctx.measureText(l || ' ').width));
  n.h = lines.length * n.fontSize * 1.2;
}
function makeNode(type, x, y, w, h, extra = {}) {
  const count = doc.filter(n => n.type === type).length + 1;
  const n = { id: newId(), type, name: `${TYPE_NAME[type]} ${count}`, x, y, w, h,
    fill: type === 'frame' ? '#FFFFFF' : type === 'text' ? '#1F1E1C' : ORANGE,
    stroke: '#1F1E1C', strokeW: 0, radius: 0, opacity: 1, parent: null };
  if (type === 'text') Object.assign(n, { text: 'Text', fontSize: 32, fontWeight: 600 });
  Object.assign(n, extra);
  if (type === 'text') measure(n);
  return n;
}
function renderList() {
  const out = [];
  for (const n of doc) if (!n.parent) { out.push(n); if (n.type === 'frame') for (const c of doc) if (c.parent === n.id) out.push(c); }
  return out;
}
const childrenOf = f => doc.filter(c => c.parent === f.id);
function topFrameAt(wx, wy, exclude) {
  for (let i = doc.length - 1; i >= 0; i--) { const n = doc[i];
    if (n.type === 'frame' && n.id !== exclude && wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n; }
  return null;
}

/* ---------- history + autosave ---------- */
let hist = [], hi = -1;
function snapshot() { return JSON.stringify(doc); }
function commit() {
  hist = hist.slice(0, hi + 1); hist.push(snapshot()); if (hist.length > 120) hist.shift(); hi = hist.length - 1;
  try { localStorage.setItem('airshape-design', JSON.stringify({ name: $('#fname').value, doc })); } catch {}
  refreshAll();
}
function restore(s) { doc = JSON.parse(s); sel = new Set([...sel].filter(id => get(id))); refreshAll(); }
function undo() { if (hi > 0) { hi--; restore(hist[hi]); } }
function redo() { if (hi < hist.length - 1) { hi++; restore(hist[hi]); } }

/* =========================================================
   RENDER
   ========================================================= */
let docDirty = true, ovDirty = true;
const dirty = () => { docDirty = ovDirty = true; };
function nodeSVG(n, exporting = false) {
  if (n._editing && !exporting) return '';
  let a = `fill="${n.fill}" opacity="${n.opacity}"`;
  if (n.strokeW > 0) a += ` stroke="${n.stroke}" stroke-width="${n.strokeW}"`;
  switch (n.type) {
    case 'frame': case 'rect':
      return `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${Math.min(n.radius, n.w / 2, n.h / 2)}" ${a}/>`;
    case 'ellipse': return `<ellipse cx="${n.x + n.w / 2}" cy="${n.y + n.h / 2}" rx="${n.w / 2}" ry="${n.h / 2}" ${a}/>`;
    case 'triangle': return `<polygon points="${n.x + n.w / 2},${n.y} ${n.x + n.w},${n.y + n.h} ${n.x},${n.y + n.h}" stroke-linejoin="round" ${a}/>`;
    case 'text': {
      const lines = String(n.text).split('\n');
      return `<text x="${n.x}" y="${n.y + n.fontSize}" font-family="${FONT}" font-size="${n.fontSize}" font-weight="${n.fontWeight}" ${a}>` +
        lines.map((l, i) => `<tspan x="${n.x}" dy="${i ? n.fontSize * 1.2 : 0}">${esc(l) || ' '}</tspan>`).join('') + '</text>';
    }
  }
  return '';
}
function docMarkup(filter, exporting) {
  let defs = '', body = '';
  for (const n of doc) {
    if (n.parent || (filter && !filter.has(n.id))) continue;
    body += nodeSVG(n, exporting);
    if (n.type === 'frame') {
      const kids = childrenOf(n).filter(c => !filter || filter.has(c.id));
      if (kids.length) {
        defs += `<clipPath id="c_${n.id}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${Math.min(n.radius, n.w / 2, n.h / 2)}"/></clipPath>`;
        body += `<g clip-path="url(#c_${n.id})">${kids.map(k => nodeSVG(k, exporting)).join('')}</g>`;
      }
    }
  }
  return { defs, body };
}
function renderDoc() {
  const { defs, body } = docMarkup(null, false);
  $('#defs').innerHTML = defs;
  $('#world').innerHTML = body;
}
function applyView() {
  $('#world').setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.z})`);
  const st = $('#stage').style, g = 20 * view.z;
  st.backgroundSize = view.z < 0.45 ? '0 0' : `${g}px ${g}px`;
  st.backgroundPosition = `${view.x}px ${view.y}px`;
  $('#zoom').textContent = Math.round(view.z * 100) + '%';
  ovDirty = true;
}
function selBBox(ids = sel) {

function fists() {
  if (locked) { fistState = null; return; }
  const fs = hands.filter(h => h.visible && h.fist && !ptr[h.id]);
  if (fs.length === 2) {
    const a = fs[0].palmScreen, b = fs[1].palmScreen, d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (!fistState || fistState.n !== 2) fistState = { n: 2, d0: Math.max(40, d), z0: view.z, w: S2W(m.x, m.y) };
    view.z = clamp(fistState.z0 * d / fistState.d0, 0.05, 16);
    view.x = m.x - fistState.w.x * view.z; view.y = m.y - fistState.w.y * view.z; applyView();
  } else if (fs.length === 1) {
    const p = fs[0].palmScreen;
    if (!fistState || fistState.n !== 1 || fistState.h !== fs[0]) fistState = { n: 1, h: fs[0], x: p.x, y: p.y };
    view.x += p.x - fistState.x; view.y += p.y - fistState.y; fistState.x = p.x; fistState.y = p.y; applyView();
  } else fistState = null;
}

/* ---- tool gestures (hold ~0.45 s) ---- */
const GT = { frame: 'frame', circle: 'ellipse', triangle: 'triangle', rect: 'rect', move: 'move' };
let locked = false;   // after a gesture fires, nothing acts until hands are shown open
let holdCand = null, holdT = 0, holdFired = false;
function segDist2(a1, a2, b1, b2) {
  const pd = (p, a, b) => { const abx = b.x - a.x, aby = b.y - a.y, t = clamp(((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1); return Math.hypot(a.x + abx * t - p.x, a.y + aby * t - p.y); };
  let m = Infinity;
  for (let i = 0; i <= 10; i++) { const t = i / 10;
    m = Math.min(m, pd({ x: a1.x + (a2.x - a1.x) * t, y: a1.y + (a2.y - a1.y) * t }, b1, b2), pd({ x: b1.x + (b2.x - b1.x) * t, y: b1.y + (b2.y - b1.y) * t }, a1, a2)); }
  return m;
}
function detectTool(dt) {
  const vis = hands.filter(h => h.visible);
  const busy = vis.some(h => ptr[h.id] || h.pinching || h.fist);
  let cand = null;
  if (!busy) {
    if (vis.length === 2) {
      const [A, B] = vis, pl = (A.palmRaw + B.palmRaw) / 2;
      if (A.g.pointer && B.g.pointer && Math.abs(A.g.idDir.dot(B.g.idDir)) < 0.5 && segDist2(A.raw[5], A.raw[8], B.raw[5], B.raw[8]) < pl * 0.45) cand = 'rect';
      else if (A.g.L && B.g.L && A.g.pc.distanceTo(B.g.pc) > pl * 1.6) cand = 'frame';
    }
    if (!cand) for (const h of vis) { if (h.g.down) { cand = 'undo'; break; } if (h.g.ok) { cand = 'circle'; break; } if (h.g.three) { cand = 'triangle'; break; } }
    if (!cand && !(vis.length === 2 && vis[0].g.pointer && vis[1].g.pointer)) for (const h of vis) if (h.g.point) { cand = 'move'; break; }
  }
  if (cand !== holdCand) { holdCand = cand; holdT = 0; holdFired = false; }
  else if (cand) { holdT += dt * 1000; if (holdT >= (cand === 'undo' ? 350 : 450) && !holdFired) { holdFired = true; setLocked(true); if (cand === 'undo') { const can = hi > 0; undo(); toast(can ? 'Undo' : 'Nothing to undo'); } else if (tool !== GT[cand]) { setTool(GT[cand]); toast(GT[cand] === 'move' ? 'Select' : TYPE_NAME[GT[cand]]); } } }
  document.querySelectorAll('.tb').forEach(b => {
    const p = holdCand && b.dataset.tool === GT[holdCand] && !holdFired ? Math.min(1, holdT / 450) : 0;
    b.querySelector('.bar').style.width = p * 100 + '%';
  });
}

/* ---- camera + MediaPipe ---- */
const video = $('#cam');
let landmarker = null, handsOn = false, lastVT = -1, stream = null;
let source = null, peer = null, phoneCall = null;
async function ensureLandmarker() {
  if (landmarker) return;
  const { HandLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d },
    runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
  try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); } catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
}
const handsLabel = t => { $('#handsBtn').lastChild.textContent = t; };
async function useStream(st, src) {
  if (stream && stream !== st) stream.getTracks().forEach(t => t.stop());
  stream = st; source = src;
  video.srcObject = st; await video.play().catch(() => {});
  handsLabel('Loading…'); await ensureLandmarker();
  handsOn = true; $('#handsBtn').classList.add('live'); handsLabel(src === 'phone' ? 'Hands · phone' : 'Hands on');
  toast('Hands on: raise your hands', true); updateHint();
}
async function startHands() {
  try {
    handsLabel('Starting…');
    const st = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    await useStream(st, 'webcam');
  } catch (e) {
    console.error(e); handsLabel('Hands');
    toast(e?.name === 'NotAllowedError' ? 'Camera permission denied' : 'Could not start hands: ' + (e.message || e), true);
  }
}
/* phone as camera: PeerJS (WebRTC) streams the phone camera here; tracking runs on this computer */
const pstat = t => $('#pstatus').textContent = t;
function phoneLink(id) {
  const base = $('#phoneUrl').value.trim().split('?')[0];
  return base + '?cam=' + encodeURIComponent(id);
}
function drawQR() {
  if (!peer?.id || !window.qrcode) return;
  const base = $('#phoneUrl').value.trim();
  if (!/^https:\/\//i.test(base)) { $('#qr').innerHTML = '<span class="muted" style="padding:16px">Paste the https:// address where this page is hosted</span>'; return; }
  const q = window.qrcode(0, 'M'); q.addData(phoneLink(peer.id)); q.make();
  $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}
async function phoneFlow() {
  $('#phoneModal').classList.add('on');
  const here = location.href.split('?')[0].split('#')[0];
  let saved = ''; try { saved = localStorage.getItem('airshape-host') || ''; } catch {}
  const hosted = /^https:/.test(here) && !/localhost|127\.0\.0\.1/.test(here);
  if (!$('#phoneUrl').value) $('#phoneUrl').value = hosted ? here : saved;
  $('#pnote').textContent = hosted ? 'The phone opens this same page in camera mode.'
    : 'This page is opened from a file, so your phone can\'t reach it. Host the file on any https:// address (GitHub Pages, Netlify Drop, Railway…) and paste that link above.';
  pstat('Getting a connection code…');
  try {
    await Promise.all([loadScript(PEER_JS), loadScript(QR_JS)]);
    if (!peer || peer.destroyed) {
      const id = 'airshape-' + Math.random().toString(36).slice(2, 10);
      peer = new window.Peer(id);
      peer.on('open', () => { drawQR(); pstat('Waiting for your phone…'); });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
      peer.on('error', e => pstat('Connection error: ' + e.type));
      peer.on('call', c => {
        if (phoneCall) phoneCall.close();
        phoneCall = c; c.answer();
        pstat('Phone found, connecting…');
        c.on('stream', async st => {
          pstat('Connected. Loading hand tracking…');
          try { await useStream(st, 'phone'); $('#phoneModal').classList.remove('on'); }
          catch (e) { pstat('Could not start: ' + (e.message || e)); }
        });
        c.on('close', () => { if (phoneCall === c) { phoneCall = null; if (source === 'phone') { stopHands(); toast('Phone disconnected', true); } } });
      });
    } else { drawQR(); pstat(phoneCall ? 'Phone connected' : 'Waiting for your phone…'); }
  } catch (e) { pstat(e.message || String(e)); }
}
$('#phoneUrl').addEventListener('input', () => { try { localStorage.setItem('airshape-host', $('#phoneUrl').value.trim()); } catch {} drawQR(); });
$('#pcancel').addEventListener('click', () => $('#phoneModal').classList.remove('on'));
$('#handsMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-src]'); if (!b) return;
  $('#handsMenu').classList.remove('on');
  b.dataset.src === 'phone' ? phoneFlow() : startHands();
});
function stopHands() {
  handsOn = false; stream?.getTracks().forEach(t => t.stop()); stream = null;
  if (source === 'phone' && phoneCall) { const c = phoneCall; phoneCall = null; c.close(); }
  source = null;
  hands.forEach(h => { cancelPtr(h.id); h.hide(); h.cursorEl.classList.remove('on'); });
  $('#handsBtn').classList.remove('live'); $('#handsBtn').lastChild.textContent = 'Hands'; updateHint();
  renderer.clear();
}
$('#handsBtn').addEventListener('click', e => { e.stopPropagation(); if (handsOn) stopHands(); else { $('#exportMenu').classList.remove('on'); $('#handsMenu').classList.toggle('on'); } });

function assign(lms, now) {
  const used = new Set(), out = [];
  for (const lm of lms) {
    let best = -1, bd = 0.25;
    hands.forEach((h, i) => { if (used.has(i) || !h.visible) return; const d = Math.hypot(lm[0].x - h.sm[0], lm[0].y - h.sm[1]); if (d < bd) { bd = d; best = i; } });
    if (best < 0) best = hands.findIndex((h, i) => !used.has(i) && !h.visible);
    if (best < 0) best = hands.findIndex((h, i) => !used.has(i));
    if (best < 0) continue; used.add(best); out.push([hands[best], lm]);
  }
  for (const [h, lm] of out) { h.update(lm, now); handFrame(h); }
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta()), now = performance.now();
  if (handsOn && landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const va = video.videoWidth / video.videoHeight, H0 = 2 * TANH * CAM_Z, W0 = H0 * camera.aspect;
    if (W0 / H0 > va) { imgW = W0; imgH = W0 / va; } else { imgH = H0; imgW = H0 * va; }
    assign(landmarker.detectForVideo(video, now).landmarks || [], now);
    fists();
  }
  if (handsOn) {
    for (const h of hands) if (h.visible && now - h.lastSeen > 260) { cancelPtr(h.id); ptrUi.delete(h.id); hoverOf[h.id] = null; h.hide(); ovDirty = true; }
    detectTool(dt);
    if (locked && hands.every(h => !h.visible || h.g.open)) setLocked(false);
    renderer.render(scene, camera);
  }
  if (docDirty) { renderDoc(); docDirty = false; }
  if (ovDirty) { renderOverlay(); ovDirty = false; }
}

/* =========================================================
   START
   ========================================================= */
function starter() {
  const f = makeNode('frame', 0, 0, 1200, 760, { name: 'Landing' });
  const P = f.id, nodes = [f];
  const add = (t, x, y, w, h, ex) => { const n = makeNode(t, x, y, w, h, { parent: P, ...ex }); nodes.push(n); doc.push(n); return n; };
  doc.push(f);
  add('rect', 0, 0, 1200, 72, { name: 'Nav', fill: '#F4F3EE' });
  add('rect', 48, 24, 24, 24, { name: 'Logo mark', radius: 7 });
  add('text', 84, 22, 0, 0, { name: 'Brand', text: 'AirShape', fontSize: 20, fontWeight: 700 });
  add('text', 96, 210, 0, 0, { name: 'Headline', text: 'Design with\nyour hands.', fontSize: 76, fontWeight: 750 });
  add('text', 98, 410, 0, 0, { name: 'Subhead', text: 'Pinch to draw. Fist to pan. Gestures pick the tools.', fontSize: 22, fontWeight: 400, fill: '#6F6C64' });
  add('rect', 98, 480, 196, 56, { name: 'Button', radius: 14 });
  add('text', 135, 494, 0, 0, { name: 'Button label', text: 'Get started', fontSize: 20, fontWeight: 600, fill: '#FFFFFF' });
  add('ellipse', 740, 140, 320, 320, { name: 'Sun' });
  add('triangle', 690, 330, 420, 330, { name: 'Peak', fill: '#C15F3C' });
  add('rect', 98, 600, 330, 84, { name: 'Note card', fill: '#F4F3EE', radius: 18 });
  add('text', 126, 628, 0, 0, { name: 'Note', text: 'Hold a gesture to switch tools', fontSize: 18, fontWeight: 500, fill: '#6F6C64' });
}
try {
  const saved = JSON.parse(localStorage.getItem('airshape-design') || 'null');
  if (saved?.doc?.length) { doc = saved.doc; $('#fname').value = saved.name || 'Untitled'; } else starter();
} catch { starter(); }
setTool('move');
hist = [snapshot()]; hi = 0;
refreshAll();
zoomFit();
loop();
}

/* =========================================================
   PHONE CAMERA PAGE  (opened from the QR code: ?cam=<computer id>)
   ========================================================= */
function phoneMain() {
  document.body.className = 'phone';
  const ui = document.createElement('div'); ui.id = 'phoneUI';
  ui.innerHTML = `<div class="top"><div class="logo"><i></i></div>AirShape camera</div>
    <video id="pv" playsinline muted autoplay></video>
    <div class="st" id="pst">Tap <b>Start camera</b> to stream to your computer</div>
    <div class="row"><button id="pflip">Switch camera</button><button class="pri" id="pgo">Start camera</button></div>
    <div class="tip">Put the phone by your monitor, facing you, in landscape if you can. Keep this page open; the screen stays awake.</div>`;
  document.body.appendChild(ui);
  const pv = ui.querySelector('#pv'), st = ui.querySelector('#pst'), go = ui.querySelector('#pgo');
  let stream = null, facing = 'user', peer = null, call = null, wake = null;
  const say = h => st.innerHTML = h;
  async function getCam() {
    const s = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } });
    pv.srcObject = s; pv.classList.toggle('mirror', facing === 'user'); await pv.play().catch(() => {});
    return s;
  }
  async function keepAwake() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });
  function connect() {
    say('Connecting to your computer…');
    call = peer.call(PHONE_TARGET, stream);
    if (!call) return say('Could not connect. Try again.');
    call.on('close', () => { say('Disconnected. Tap <b>Reconnect</b>'); go.textContent = 'Reconnect'; go.disabled = false; });
    call.peerConnection?.addEventListener('connectionstatechange', () => {
      const cs = call.peerConnection.connectionState;
      if (cs === 'connected') { say('<b>● Live</b>: your computer is using this camera'); go.textContent = 'Connected'; go.disabled = true; }
      if (cs === 'failed') { say('Connection failed. Are both devices on the same Wi-Fi?'); go.textContent = 'Reconnect'; go.disabled = false; }
    });
  }
  go.addEventListener('click', async () => {
    go.disabled = true;
    try {
      if (!window.isSecureContext) throw new Error('This page must be opened over https:// for the camera to work.');
      if (!stream) { say('Starting camera…'); stream = await getCam(); }
      keepAwake();
      if (!peer || peer.destroyed) {
        say('Starting connection…'); await loadScript(PEER_JS);
        peer = new window.Peer();
        peer.on('open', connect);
        peer.on('error', e => { say(e.type === 'peer-unavailable' ? 'Computer not found. Open the QR code again on your computer.' : 'Connection error: ' + e.type); go.textContent = 'Reconnect'; go.disabled = false; });
        peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
      } else connect();
    } catch (e) { say(e.name === 'NotAllowedError' ? 'Camera permission was denied' : (e.message || String(e))); go.disabled = false; }
  });
  ui.querySelector('#pflip').addEventListener('click', async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try {
      const old = stream; stream = await getCam();
      const track = stream.getVideoTracks()[0];
      const sender = call?.peerConnection?.getSenders().find(x => x.track && x.track.kind === 'video');
      if (sender) await sender.replaceTrack(track);
      old?.getTracks().forEach(t => t.stop());
    } catch (e) { say('Could not switch camera: ' + (e.message || e)); }
  });
}
